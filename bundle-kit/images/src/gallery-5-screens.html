<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />
<style>
  :root { --w: 1280px; --h: 720px; }
  .head { position: absolute; left: 64px; top: 52px; display: grid; gap: 10px; }
  h2 { font-size: 40px; }
  .head p { font-size: 19px; color: var(--muted); }
  .tiles { position: absolute; left: 64px; right: 64px; top: 168px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 16px; }
  .tile { display: grid; gap: 8px; }
  .tile .f { height: 210px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .tile img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .tile span { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
  <div class="head">
    <h2>55 screens in DashDrop</h2>
    <p>Sign-in, reports, customers, billing, alerts, team, settings and a UI kit. Every screen in three themes.</p>
  </div>
  <div class="tiles">
    <div class="tile"><div class="f"><img src="shots/dd-report-mrr-light.png" alt="" /></div><span>MRR report</span></div>
    <div class="tile"><div class="f"><img src="shots/dd-subscriptions-light.png" alt="" /></div><span>Subscriptions</span></div>
    <div class="tile"><div class="f"><img src="shots/dd-invoice-new-light.png" alt="" /></div><span>New invoice</span></div>
    <div class="tile"><div class="f"><img src="shots/dd-onboarding-billing-light.png" alt="" /></div><span>Onboarding</span></div>
    <div class="tile"><div class="f"><img src="shots/dd-at-risk-dark.png" alt="" /></div><span>At-risk accounts, dark</span></div>
    <div class="tile"><div class="f"><img src="shots/dd-inbox-light.png" alt="" /></div><span>Inbox</span></div>
    <div class="tile"><div class="f"><img src="shots/dd-plans-sand.png" alt="" /></div><span>Plans, sand theme</span></div>
    <div class="tile"><div class="f"><img src="shots/dd-ui-overlays-light.png" alt="" /></div><span>UI kit</span></div>
  </div>
</body>
</html>
