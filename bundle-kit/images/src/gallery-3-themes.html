<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />
<style>
  :root { --w: 1280px; --h: 720px; }
  .head { position: absolute; left: 64px; top: 52px; display: grid; gap: 10px; }
  h2 { font-size: 40px; }
  .head p { font-size: 19px; color: var(--muted); }
  .col { position: absolute; top: 172px; width: 362px; display: grid; gap: 12px; }
  .col strong { font-size: 18px; font-weight: 600; }
  .col .f { position: relative; height: 226px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .col img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
</style>
</head>
<body>
  <div class="head">
    <h2>Three themes, one token file</h2>
    <p>Light, dark and sand. Switch at runtime; the choice is saved in the browser.</p>
  </div>
  <div class="col" style="left:64px"><strong>Light</strong><div class="f"><img src="shots/sd-home-light.png" alt="" /></div><div class="f"><img src="shots/dd-overview-light.png" alt="" /></div></div>
  <div class="col" style="left:459px"><strong>Dark</strong><div class="f"><img src="shots/sd-home-dark.png" alt="" /></div><div class="f"><img src="shots/dd-overview-dark.png" alt="" /></div></div>
  <div class="col" style="left:854px"><strong>Sand</strong><div class="f"><img src="shots/sd-home-sand.png" alt="" /></div><div class="f"><img src="shots/dd-overview-sand.png" alt="" /></div></div>
</body>
</html>
